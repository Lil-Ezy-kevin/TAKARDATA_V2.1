services:
  - type: web
    name: takardata-v21
    runtime: node
    plan: free
        buildCommand: npm install --prefix backend && npm install --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: "*"
      - key: UPLOAD_DIR
        value: uploads
